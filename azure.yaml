# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: computer-use-foundry-agent-win365
requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.15'
    azure.ai.projects: '>=1.0.0-beta.10'
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT:-}
  win365-desktop-agent:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Agent Framework
        - Windows 365
        - .NET
    project: src/Win365Agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: Win365Agent.dll
    uses:
      - ai-project
    kind: hosted
    name: win365-desktop-agent
    displayName: Windows 365 direct-tool agent
    description: Single-operator, bounded desktop tasks using W365 tools through Agent Framework.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      SAMPLE_LOCAL_MODE: 'false'
      W365_ENABLED: ${W365_ENABLED:-false}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME:-gpt-6-astra}
      W365_TENANT_ID: ${W365_TENANT_ID:-}
      W365_BLUEPRINT_ID: ${W365_BLUEPRINT_ID:-}
      W365_AGENT_ID: ${W365_AGENT_ID:-}
      W365_AGENT_OBJECT_ID: ${W365_AGENT_OBJECT_ID:-}
      W365_AGENT_USER_ID: ${W365_AGENT_USER_ID:-}
      W365_BLUEPRINT_CREDENTIAL_MODE: ${W365_BLUEPRINT_CREDENTIAL_MODE:-client_secret}
      W365_CLIENT_SECRET: ${W365_CLIENT_SECRET:-}
      SESSION_BLOB_URI: ${SESSION_BLOB_URI:-}
      OPERATOR_TENANT_ID: ${OPERATOR_TENANT_ID:-}
      OPERATOR_OBJECT_ID: ${OPERATOR_OBJECT_ID:-}
      HOSTED_ALLOWED_USER_ID: ${HOSTED_ALLOWED_USER_ID:-}
      VIEWER_PUBLIC_URL: ${VIEWER_PUBLIC_URL:-}
      SCREENSHARE_APP_URL: ${SCREENSHARE_APP_URL:-}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  layers:
    - name: foundry
      provider: bicep
      path: ./infra/foundry
    - name: state
      provider: bicep
      path: ./infra/state
      dependsOn:
        - foundry
    - name: viewer
      provider: bicep
      path: ./infra/viewer
      dependsOn:
        - foundry
        - state
hooks:
  preup:
    windows:
      shell: pwsh
      run: ./scripts/Show-AzdUpContext.ps1
      interactive: false
      continueOnError: false
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/Show-DeploymentPlan.ps1
      interactive: false
      continueOnError: false
  predown:
    windows:
      shell: pwsh
      run: ./scripts/Remove-W365Resources.ps1 -UseDeviceCode
      interactive: true
      continueOnError: false
  postup:
    windows:
      shell: pwsh
      run: ./scripts/Complete-AzdUp.ps1
      interactive: true
      continueOnError: false
