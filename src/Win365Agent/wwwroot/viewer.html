<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows 365 agent desktop</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" defer></script>
</head>
<body>
  <h1>Windows 365 agent desktop</h1>
  <p>Taking control pauses automation. Closing this tab does not resume it.</p>
  <p id="status" role="status">Loading session...</p>
  <button id="watch" disabled>Watch live</button>
  <button id="control" disabled>Pause and take control</button>
  <button id="resume" disabled>Release control and resume agent</button>
  <div id="viewer"></div>
</body>
</html>
