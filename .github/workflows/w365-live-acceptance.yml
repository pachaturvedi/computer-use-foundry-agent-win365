name: W365 live acceptance

on:
  workflow_dispatch:
    inputs:
      azure_subscription_id:
        description: Azure subscription ID
        required: true
        type: string
      azure_tenant_id:
        description: Entra tenant ID shared by Foundry and W365
        required: true
        type: string
      azure_location:
        description: Azure location; change if the tenant uses another supported region
        required: true
        default: eastus
        type: string
      resource_prefix:
        description: Unique 2-12 character lowercase acceptance prefix
        required: true
        default: w365accept
        type: string
      agent_user_domain:
        description: Optional verified tenant domain; leave empty for automatic default
        required: false
        type: string
      w365_pool_billing_plan_id:
        description: Tenant-specific W365 billing plan GUID (no portable default)
        required: true
        type: string
      w365_pool_geographic_location_type:
        description: Sample default; change if unsupported by the tenant
        required: true
        default: usCentral
        type: string
      w365_pool_region_group:
        description: Sample default; change if unsupported by the tenant
        required: true
        default: usCentral
        type: string
      w365_pool_regions:
        description: Comma-separated sample regions; change if unsupported
        required: true
        default: centralus
        type: string
      w365_pool_image_id:
        description: Windows 11 Enterprise 25H2 sample; change if unavailable
        required: true
        default: microsoftwindowsdesktop_windows-ent-cpc_win11-25h2-ent-cpc-m365
        type: string
      billing_approval:
        description: Type I_APPROVE_W365_BILLING_AND_CLEANUP
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: w365-live-acceptance
  cancel-in-progress: false

jobs:
  live-acceptance:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Authenticate azd and install prerequisites
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ inputs.azure_tenant_id }}
          AZURE_DEV_USER_AGENT: microsoft_foundry_skill
        run: |
          azd auth login `
            --client-id $env:AZURE_CLIENT_ID `
            --tenant-id $env:AZURE_TENANT_ID `
            --federated-credential-provider github `
            --no-prompt
          azd ext install microsoft.foundry
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Force -AllowClobber

      - name: Create ignored W365 profile
        shell: pwsh
        env:
          BILLING_PLAN_ID: ${{ inputs.w365_pool_billing_plan_id }}
          GEOGRAPHIC_LOCATION_TYPE: ${{ inputs.w365_pool_geographic_location_type }}
          REGION_GROUP: ${{ inputs.w365_pool_region_group }}
          REGIONS: ${{ inputs.w365_pool_regions }}
          IMAGE_ID: ${{ inputs.w365_pool_image_id }}
        run: |
          $billingPlanId = [guid]::Empty
          if (![guid]::TryParse($env:BILLING_PLAN_ID, [ref]$billingPlanId) -or
              $billingPlanId -eq [guid]::Empty) {
            throw 'w365_pool_billing_plan_id must be a non-empty GUID.'
          }
          $regions = @($env:REGIONS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ([string]::IsNullOrWhiteSpace($env:GEOGRAPHIC_LOCATION_TYPE) -or
              [string]::IsNullOrWhiteSpace($env:REGION_GROUP) -or
              [string]::IsNullOrWhiteSpace($env:IMAGE_ID) -or
              $regions.Count -eq 0) {
            throw 'The W365 pool profile is incomplete.'
          }
          @{
            w365 = @{
              poolBillingPlanId = $billingPlanId.ToString()
              poolBillingType = 'payAsYouGo'
              poolGeographicLocationType = $env:GEOGRAPHIC_LOCATION_TYPE
              poolRegionGroup = $env:REGION_GROUP
              poolRegions = $regions
              poolImageId = $env:IMAGE_ID
              poolImageType = 'gallery'
              poolOsLocale = 'en-US'
              poolMinimumCount = 1
              poolMaximumCount = 1
              poolEnableSingleSignOn = $false
            }
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath .\config\deployment.local.json -Encoding utf8

      - name: Run the azd-centered acceptance driver
        shell: pwsh
        timeout-minutes: 150
        env:
          AZURE_DEV_USER_AGENT: microsoft_foundry_skill
          SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
          TENANT_ID: ${{ inputs.azure_tenant_id }}
          LOCATION: ${{ inputs.azure_location }}
          PREFIX: ${{ inputs.resource_prefix }}
          AGENT_USER_DOMAIN: ${{ inputs.agent_user_domain }}
          APPROVAL: ${{ inputs.billing_approval }}
        run: |
          $arguments = @{
            SubscriptionId = [guid]$env:SUBSCRIPTION_ID
            TenantId = [guid]$env:TENANT_ID
            Prefix = $env:PREFIX
            Location = $env:LOCATION
            ApprovalPhrase = $env:APPROVAL
            RemoveEnvironmentAfterCleanup = $true
          }
          if (![string]::IsNullOrWhiteSpace($env:AGENT_USER_DOMAIN)) {
            $arguments.AgentUserDomain = $env:AGENT_USER_DOMAIN
          }
          ./scripts/Invoke-W365LiveAcceptance.ps1 @arguments

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w365-live-acceptance-${{ github.run_id }}
          path: artifacts/w365-live-acceptance/*.json
          if-no-files-found: warn
          retention-days: 14
