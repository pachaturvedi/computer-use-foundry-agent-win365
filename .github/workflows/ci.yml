name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the shared pre-PR validation gate
        shell: pwsh
        run: ./scripts/Validate-PrePr.ps1
  windows-quickstart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Run the documented Windows setup
        shell: pwsh
        run: ./scripts/Setup-Local.ps1
      - name: Validate azd and Foundry extension requirements
        shell: pwsh
        run: |
          azd ext install microsoft.foundry
          ./tests/PowerShell/Invoke-PowerShellTests.ps1 -Category Platform
