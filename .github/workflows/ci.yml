name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Win365FoundrySample.slnx
      - run: dotnet format Win365FoundrySample.slnx --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet test Win365FoundrySample.slnx -c Release --no-restore
      - name: Parse PowerShell and exercise offline setup plan
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem scripts/*.ps1, tests/PowerShell/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            $failed += $errors
          }
          if ($failed.Count) { $failed | Format-List; exit 1 }
          ./scripts/Setup-W365.ps1 -TenantId ([guid]::Empty) -BlueprintId ([guid]::Empty) -AgentIdentityId ([guid]::Empty) -AgentUserPrincipalName agent@example.com -PoolId ([guid]::Empty) -WhatIf
          ./tests/PowerShell/Test-SetupOffline.ps1
          ./tests/PowerShell/Test-RemoveW365ResourcesOffline.ps1
          ./tests/PowerShell/Test-W365TeardownFlowOffline.ps1
          ./tests/PowerShell/Test-DiscoveryOffline.ps1
  windows-quickstart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Run the documented Windows setup
        shell: pwsh
        run: ./scripts/Setup-Local.ps1
      - name: Validate azd and Foundry extension requirements
        shell: pwsh
        run: |
          azd ext install microsoft.foundry
          ./tests/PowerShell/Test-AzdPrerequisites.ps1
